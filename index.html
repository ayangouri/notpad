<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070508">
<meta name="color-scheme" content="dark">
<title>Notes · うちは</title>
<style>
:root{
  --bg:#070508; --panel:rgba(14,9,11,.82); --card:rgba(20,11,14,.9);
  --line:#3a252a; --red:#c0392b; --red2:#e74c3c; --text:#efe3e0; --muted:#8a6f6f;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  min-height:100dvh; background:var(--bg); color:var(--text);
  font-family:'Segoe UI',Roboto,system-ui,sans-serif;
  background-image:radial-gradient(circle at 20% 15%,rgba(160,40,60,.2),transparent 45%),
                   radial-gradient(circle at 85% 85%,rgba(130,20,30,.25),transparent 50%);
  background-attachment:fixed; overflow-x:hidden;
  padding:1rem max(1rem,env(safe-area-inset-right)) 2rem max(1rem,env(safe-area-inset-left));
}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}

/* bg rotating sharingan pattern */
.fx .pattern{position:absolute;inset:-30%;opacity:.07;animation:spin 160s linear infinite;will-change:transform}
@keyframes spin{to{transform:rotate(360deg)}}

/* intro: moonlit scene -> dive into the red eyes -> notepad */
#intro{position:fixed;inset:0;z-index:100;background:#000;overflow:hidden;cursor:pointer;transition:opacity .7s ease}
#intro.gone{opacity:0;pointer-events:none}
#intro::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 45%,rgba(0,0,0,.65) 100%)}
.scene{--W:max(100vw,calc(100dvh*.5625));--H:calc(var(--W)/.5625);position:absolute;width:var(--W);height:var(--H);
  left:calc(50vw - var(--W)/2);top:calc(50dvh - var(--H)/2);transform-origin:49.85% 44.5%;opacity:0;will-change:transform;
  animation:pin 1.3s ease-out .1s forwards,dive 4.6s linear .1s forwards}
.scene>*{position:absolute;inset:0;width:100%;height:100%;display:block}
@keyframes pin{to{opacity:1}}
@keyframes dive{
  0%{transform:translate(0,0) scale(1);animation-timing-function:cubic-bezier(.2,.6,.3,1)}
  48%{transform:translate(0,0) scale(1.14);animation-timing-function:cubic-bezier(.65,0,.95,.4)}
  100%{transform:translate(calc(var(--W)*.0015),calc(var(--H)*.055)) scale(26)}
}
.moonglow{background:radial-gradient(ellipse 36% 20.2% at 50% 49%,rgba(255,225,220,.5),transparent 70%);mix-blend-mode:screen;opacity:0;animation:mg 3s ease-in-out infinite alternate}
@keyframes mg{from{opacity:.15}to{opacity:.9}}
.crows{overflow:hidden}
.ic{position:absolute;left:-12%;width:8%;animation:icf 4.8s linear forwards}
.ic svg{display:block;width:100%;fill:#12040a;animation:flap .3s ease-in-out infinite alternate}
@keyframes icf{to{transform:translate(1500%,var(--dy,-200%))}}
.glow{opacity:0;animation:pin .8s ease-out 1.2s forwards,mg 1.1s ease-in-out 2s infinite alternate}
.iris{opacity:0;animation:pin .6s ease-out 1.4s forwards}
.tm{transform-box:view-box;animation:spin 2.5s linear infinite}
.big{position:absolute;left:50%;top:50%;width:min(130vmin,720px);opacity:0;transform:translate(-50%,-50%) scale(.5);animation:bigin .9s ease-out 4s forwards}
.big .tm{transform-origin:50px 50px;animation-duration:1.8s}
@keyframes bigin{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.skip{position:absolute;z-index:2;left:0;right:0;text-align:center;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));font-size:.7rem;letter-spacing:3px;color:#c9a0a0;text-transform:uppercase;opacity:0;animation:pin 1s 1s forwards}

/* embers */
.ember{position:absolute;bottom:-10px;border-radius:50%;background:#c33;box-shadow:0 0 10px 2px rgba(220,60,60,.6);
  opacity:0;animation:rise linear infinite;will-change:transform,opacity}
@keyframes rise{0%{transform:translate(0,0) scale(.5);opacity:0}10%,85%{opacity:.8}
  100%{transform:translate(var(--dx,40px),-110dvh) scale(1.2);opacity:0}}

/* crows */
.crow{position:absolute;left:-60px;width:44px;fill:#000;opacity:.65;animation:fly linear forwards;will-change:transform}
.crow svg{width:100%;animation:flap .35s ease-in-out infinite alternate;transform-origin:center}
@keyframes fly{to{transform:translate(calc(100vw + 120px),var(--dy,-80px))}}
@keyframes flap{to{transform:scaleY(.55)}}

/* tap ripple */
.ripple{position:fixed;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;pointer-events:none;z-index:50;
  border:2px solid var(--red2);animation:rip .7s ease-out forwards}
@keyframes rip{to{transform:scale(9);opacity:0}}

/* app */
.app{position:relative;z-index:5;max-width:900px;margin:0 auto;background:var(--panel);
  border:1px solid rgba(200,70,80,.3);border-radius:1.6rem;padding:1.2rem;
  box-shadow:0 20px 50px rgba(0,0,0,.7);opacity:0}
body.ready .app{animation:enter 1s cubic-bezier(.2,.9,.3,1) both}
@keyframes enter{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:none}}
@media(min-width:700px){.app{padding:2rem;border-radius:2.2rem;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}}

header{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:1.4rem}
.brand{display:flex;align-items:center;gap:.9rem;min-width:0}
.sh{width:46px;height:46px;flex:none;filter:drop-shadow(0 0 10px #a02b2b);animation:pulse 2.2s ease-in-out infinite alternate}
.sh .tomoe{transform-origin:50px 50px;animation:spin 8s linear infinite}
.sh.boost .tomoe{animation-duration:.6s}
@keyframes pulse{to{filter:drop-shadow(0 0 20px #e74c3c);transform:scale(1.08)}}
h1{font-size:clamp(1.15rem,5.5vw,2rem);font-weight:300;letter-spacing:3px;text-transform:uppercase;
  background:linear-gradient(90deg,#e0bebe,#c07b7b,#e0bebe);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  border-left:3px solid #a13e3e;padding-left:.8rem;animation:shine 5s linear infinite}
@keyframes shine{to{background-position:-200% 0}}
.kanji{font-size:1.3rem;color:#8a3a3a;text-shadow:0 0 10px #b33;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px);opacity:.9}0%,100%{opacity:.5}}

.creator{position:relative;overflow:hidden;background:rgba(20,12,15,.85);border:1px solid var(--line);
  border-radius:1.4rem;padding:1rem 1.1rem 1.1rem;margin-bottom:1.4rem;animation:bpulse 5s ease-in-out infinite alternate}
@keyframes bpulse{to{border-color:#7a3535;box-shadow:0 0 22px rgba(150,30,30,.35)}}
.creator::before{content:'';position:absolute;top:0;left:0;width:40%;height:2px;
  background:linear-gradient(90deg,transparent,#d44,transparent);animation:scan 3.5s linear infinite}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.creator:focus-within{border-color:#b15151;box-shadow:0 0 28px rgba(190,60,60,.45);animation:none}
.creator.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
textarea{width:100%;min-height:96px;max-height:220px;resize:vertical;background:transparent;border:0;outline:0;
  color:var(--text);font:300 16px/1.6 inherit;font-family:inherit;letter-spacing:.3px}
textarea::placeholder{color:#7a5555;font-style:italic}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:.5rem;gap:1rem}
.count{font-size:.75rem;color:var(--muted);letter-spacing:1px}

.btn{position:relative;overflow:hidden;min-height:48px;padding:0 1.6rem;border-radius:3rem;border:1.5px solid #a34040;
  background:transparent;color:#f0d6d6;font:400 .95rem inherit;font-family:inherit;letter-spacing:1.6px;
  display:flex;align-items:center;gap:.6rem;cursor:pointer;touch-action:manipulation;
  box-shadow:0 0 12px rgba(180,50,50,.3);transition:transform .2s,background .3s,color .3s}
.btn svg{width:18px;height:18px;fill:currentColor}
.btn:active{transform:scale(.93);background:#a34040;color:#0b0708}
@media(hover:hover){.btn:hover{background:#a34040;color:#0b0708;box-shadow:0 0 34px #c05a5a}}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1rem}
.card{position:relative;overflow:hidden;background:var(--card);border:1px solid #2f2024;border-radius:1.3rem;
  padding:1.1rem 1.1rem .8rem 1.3rem;display:flex;flex-direction:column;word-break:break-word;
  animation:appear .6s cubic-bezier(.2,.9,.3,1) both;transition:transform .3s,border-color .3s}
.card::before{content:'';position:absolute;left:0;top:0;width:4px;height:100%;background:linear-gradient(#b33b3b,#521e1e)}
.card::after{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(220,90,90,.12) 50%,transparent 60%);
  transform:translateX(-120%);animation:sweep 6s ease-in-out infinite;animation-delay:var(--sd,0s);pointer-events:none}
@keyframes sweep{0%,70%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
@keyframes appear{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:none}}
.card:active{transform:scale(.98);border-color:#a14545}
@media(hover:hover){.card:hover{transform:translateY(-6px);border-color:#a14545}}
.card.out{animation:vanish .45s ease-in forwards}
@keyframes vanish{to{opacity:0;transform:scale(.7) rotate(-4deg);filter:blur(6px)}}
.txt{white-space:pre-wrap;line-height:1.65;font-weight:300;flex:1;margin-bottom:.9rem;font-size:1rem}
.foot{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed #3b2a2a;padding-top:.4rem}
.time{font-size:.7rem;color:#866e6e;letter-spacing:.8px;text-transform:uppercase}
.del{width:44px;height:44px;margin:-6px -8px -6px 0;border:0;border-radius:50%;background:transparent;color:#a66;
  display:grid;place-items:center;cursor:pointer;touch-action:manipulation;transition:transform .25s,color .25s}
.del svg{width:20px;height:20px;fill:currentColor}
.del:active{color:#ff7b7b;transform:scale(1.3) rotate(12deg);background:rgba(180,40,40,.2)}
.empty{grid-column:1/-1;text-align:center;color:#6a4a4a;font-style:italic;padding:2.4rem 1rem;letter-spacing:1.2px;
  border:1px dashed #362a2a;border-radius:1.4rem;animation:ep 3.5s ease-in-out infinite alternate}
@keyframes ep{from{opacity:.55}to{opacity:1;border-color:#5a3a3a}}
.quote{margin-top:1.6rem;padding-top:.9rem;border-top:1px solid #2a1c1c;font-size:.72rem;color:#7a5a5a;
  letter-spacing:1.5px;text-transform:uppercase;line-height:1.6}

/* weaker effects for small / low-motion devices */
@media(max-width:600px){.fx .pattern{animation-duration:240s}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
body.paused *{animation-play-state:paused!important}
</style>
</head>
<body>

<div class="fx" id="fx" aria-hidden="true">
  <svg class="pattern" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <circle cx="100" cy="100" r="80" fill="none" stroke="#b33" stroke-width="1"/>
    <circle cx="100" cy="100" r="14" fill="#b33"/>
    <circle cx="100" cy="55" r="8" fill="#b33"/><circle cx="139" cy="122" r="8" fill="#b33"/><circle cx="61" cy="122" r="8" fill="#b33"/>
  </svg>
</div>

<div id="intro" aria-hidden="true">
  <div class="scene">
    <img src="itachi.jpg" alt="">
    <div class="moonglow"></div>
    <div class="crows"><div class="ic" style="top:14%;--dy:-200%;animation-delay:0.6s"><svg viewBox="0 0 64 32"><path d="M0 14 Q16 0 32 16 Q48 0 64 14 Q48 12 32 24 Q16 12 0 14Z"/></svg></div><div class="ic" style="top:30%;--dy:120%;animation-delay:1.4s"><svg viewBox="0 0 64 32"><path d="M0 14 Q16 0 32 16 Q48 0 64 14 Q48 12 32 24 Q16 12 0 14Z"/></svg></div><div class="ic" style="top:22%;--dy:-120%;animation-delay:2.4s"><svg viewBox="0 0 64 32"><path d="M0 14 Q16 0 32 16 Q48 0 64 14 Q48 12 32 24 Q16 12 0 14Z"/></svg></div><div class="ic" style="top:38%;--dy:160%;animation-delay:0.2s"><svg viewBox="0 0 64 32"><path d="M0 14 Q16 0 32 16 Q48 0 64 14 Q48 12 32 24 Q16 12 0 14Z"/></svg></div></div>
    <svg viewBox="0 0 675 1200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="eg"><stop offset="0" stop-color="#ff2a2a" stop-opacity=".75"/><stop offset="1" stop-color="#ff2a2a" stop-opacity="0"/></radialGradient>
        <clipPath id="e1"><ellipse cx="328.5" cy="534" rx="3.9" ry="2.7"/></clipPath>
        <clipPath id="e2"><ellipse cx="344.6" cy="533.8" rx="3.9" ry="2.7"/></clipPath>
      </defs>
      <g class="glow"><circle cx="328.5" cy="534" r="16" fill="url(#eg)"/><circle cx="344.6" cy="533.8" r="16" fill="url(#eg)"/></g>
      <g class="iris" transform="rotate(10 328.5 534)" clip-path="url(#e1)">
      <ellipse cx="328.5" cy="534" rx="3.9" ry="2.7" fill="#d8161c"/>
      <g class="tm" style="transform-origin:328.5px 534px"><circle cx="328.5" cy="531.3" r=".85"/><circle cx="330.8" cy="535.3" r=".85"/><circle cx="326.2" cy="535.3" r=".85"/></g>
      <circle cx="328.5" cy="534" r=".8"/></g>
      <g class="iris" transform="rotate(-10 344.6 533.8)" clip-path="url(#e2)">
      <ellipse cx="344.6" cy="533.8" rx="3.9" ry="2.7" fill="#d8161c"/>
      <g class="tm" style="transform-origin:344.6px 533.8px"><circle cx="344.6" cy="531.1" r=".85"/><circle cx="346.9" cy="535.1" r=".85"/><circle cx="342.3" cy="535.1" r=".85"/></g>
      <circle cx="344.6" cy="533.8" r=".8"/></g>
    </svg>
  </div>
  <svg class="big" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="48" fill="#b3261e"/>
    <circle cx="50" cy="50" r="34" fill="none" stroke="#1a0608" stroke-width="1.5"/>
    <g class="tm" fill="#0a0305"><circle cx="50" cy="22" r="7"/><circle cx="74" cy="64" r="7"/><circle cx="26" cy="64" r="7"/></g>
    <circle cx="50" cy="50" r="9" fill="#0a0305"/>
  </svg>
  <div class="skip">tap to skip</div>
</div>

<main class="app">
  <header>
    <div class="brand">
      <svg class="sh" id="sh" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="46" fill="#b3261e"/>
        <circle cx="50" cy="50" r="34" fill="none" stroke="#1a0608" stroke-width="2"/>
        <g class="tomoe" fill="#0a0305">
          <circle cx="50" cy="22" r="7"/><circle cx="74" cy="64" r="7"/><circle cx="26" cy="64" r="7"/>
        </g>
        <circle cx="50" cy="50" r="9" fill="#0a0305"/>
      </svg>
      <h1>Notes</h1>
    </div>
    <div class="kanji">うちは</div>
  </header>

  <section class="creator" id="creator">
    <textarea id="input" maxlength="600" placeholder="Write your note… (Genjutsu of words)"></textarea>
    <div class="row">
      <span class="count" id="count">0 / 600</span>
      <button class="btn" id="save" type="button">
        <svg viewBox="0 0 24 24"><path d="M20.7 3.3C14 3.6 8.6 8 7.3 14.2L5 16.5V19h2.5l2.3-2.3c6.2-1.3 10.6-6.7 10.9-13.4zM9 15c1-3 3.6-5.6 6.6-6.6L9 15z"/></svg>
        SAVE NOTE
      </button>
    </div>
  </section>

  <section class="grid" id="grid"></section>

  <div class="quote">“People live their lives bound by what they accept as correct.”</div>
</main>

<script>
(function(){
  var KEY='itachi_dark_notes_v4';
  var grid=document.getElementById('grid'), input=document.getElementById('input'),
      saveBtn=document.getElementById('save'), creator=document.getElementById('creator'),
      count=document.getElementById('count'), sh=document.getElementById('sh'), fx=document.getElementById('fx');
  var notes=[];
  var small=window.matchMedia('(max-width:600px)').matches;
  var reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;

  function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

  /* embers */
  function embers(){
    var n=small?8:16;
    for(var i=0;i<n;i++){
      var e=document.createElement('div'); e.className='ember';
      var s=2+Math.random()*3;
      e.style.cssText='left:'+Math.random()*100+'vw;width:'+s+'px;height:'+s+'px;--dx:'+(Math.random()*120-60)+'px;'+
        'animation-duration:'+(12+Math.random()*18)+'s;animation-delay:'+(Math.random()*12)+'s';
      fx.appendChild(e);
    }
  }
  /* burst of embers when saving */
  function burst(){
    for(var i=0;i<10;i++){
      var e=document.createElement('div'); e.className='ember';
      e.style.cssText='left:'+(20+Math.random()*60)+'vw;width:4px;height:4px;--dx:'+(Math.random()*160-80)+'px;'+
        'animation-duration:'+(2+Math.random()*2)+'s;animation-iteration-count:1';
      fx.appendChild(e); setTimeout(function(el){return function(){el.remove()}}(e),4200);
    }
  }
  /* crows flying across */
  var CROW='<svg viewBox="0 0 64 32"><path d="M0 14 Q16 0 32 16 Q48 0 64 14 Q48 12 32 24 Q16 12 0 14Z"/></svg>';
  function crow(){
    if(document.hidden||reduce) return;
    var c=document.createElement('div'); c.className='crow'; c.innerHTML=CROW;
    var dur=9+Math.random()*6;
    c.style.cssText='top:'+(8+Math.random()*45)+'vh;--dy:'+(Math.random()*120-60)+'px;animation-duration:'+dur+'s';
    fx.appendChild(c); setTimeout(function(){c.remove()},dur*1000+200);
  }
  setInterval(crow,8000); setTimeout(crow,1500);

  /* tap ripple */
  document.addEventListener('pointerdown',function(e){
    if(reduce) return;
    var r=document.createElement('div'); r.className='ripple';
    r.style.left=e.clientX+'px'; r.style.top=e.clientY+'px';
    document.body.appendChild(r); setTimeout(function(){r.remove()},750);
  },{passive:true});

  /* pause animations when tab hidden (saves battery on Android) */
  document.addEventListener('visibilitychange',function(){document.body.classList.toggle('paused',document.hidden)});

  /* storage */
  function load(){
    try{var s=localStorage.getItem(KEY); if(s) notes=JSON.parse(s)||[]; else seed();}catch(e){seed(false)}
    render();
  }
  function seed(save){
    var now=Date.now();
    notes=[{id:now+1,text:'Those who forgive themselves, and are able to accept their true nature… they are the strong ones.',ts:now-864e5},
           {id:now+2,text:'It is not the face that makes someone a monster; it’s the choices they make.',ts:now-36e5}];
    if(save!==false) persist();
  }
  function persist(){try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){}}
  function fmt(ts){try{return new Date(ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}

  var TRASH='<svg viewBox="0 0 24 24"><path d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6zM19 4h-3.5l-1-1h-5l-1 1H5v2h14z"/></svg>';

  function card(n,i){
    var c=document.createElement('article'); c.className='card'; c.dataset.id=n.id;
    c.style.animationDelay=Math.min(i*0.06,0.6)+'s'; c.style.setProperty('--sd',(i*0.8)+'s');
    var t=document.createElement('div'); t.className='txt'; t.textContent=n.text;
    var f=document.createElement('div'); f.className='foot';
    var tm=document.createElement('span'); tm.className='time'; tm.textContent=fmt(n.ts);
    var d=document.createElement('button'); d.className='del'; d.type='button'; d.setAttribute('aria-label','Delete note'); d.innerHTML=TRASH;
    d.addEventListener('click',function(){remove(n.id,c)});
    f.appendChild(tm); f.appendChild(d); c.appendChild(t); c.appendChild(f);
    return c;
  }
  function render(){
    grid.textContent='';
    if(!notes.length){
      var e=document.createElement('div'); e.className='empty';
      e.textContent='✧ no notes yet — like the moon, quietly waiting ✧'; grid.appendChild(e); return;
    }
    notes.slice().sort(function(a,b){return b.id-a.id}).forEach(function(n,i){grid.appendChild(card(n,i))});
  }

  function add(){
    var text=input.value.trim();
    if(!text){creator.classList.remove('shake'); void creator.offsetWidth; creator.classList.add('shake'); buzz([20,40,20]); return;}
    var now=Date.now();
    notes.push({id:now,text:text,ts:now});
    persist(); render();
    input.value=''; count.textContent='0 / 600';
    sh.classList.add('boost'); setTimeout(function(){sh.classList.remove('boost')},900);
    burst(); buzz(25);
    grid.scrollIntoView({behavior:'smooth',block:'start'});
  }
  function remove(id,el){
    buzz(15);
    function done(){notes=notes.filter(function(n){return n.id!==id}); persist(); render();}
    if(el){el.classList.add('out'); setTimeout(done,420);} else done();
  }

  input.addEventListener('input',function(){count.textContent=input.value.length+' / 600'});
  input.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();add()}});
  saveBtn.addEventListener('click',add);

  /* intro -> app */
  var intro=document.getElementById('intro'), started=false;
  function startApp(){
    if(started) return; started=true;
    intro.classList.add('gone'); document.body.classList.add('ready');
    setTimeout(function(){intro.remove()},800);
  }
  if(reduce){startApp()}else{intro.addEventListener('click',startApp); setTimeout(startApp,5100)}

  embers(); load();
})();
</script>
</body>
</html>
